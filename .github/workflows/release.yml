name: Attach release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build/persistent-account-menu-for-hivepress
          cp persistent-account-menu-for-hivepress.php README.md build/persistent-account-menu-for-hivepress/
          cd build
          zip -r persistent-account-menu-for-hivepress.zip persistent-account-menu-for-hivepress

      - name: Upload asset to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/persistent-account-menu-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
